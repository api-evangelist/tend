aid: tend
name: Tend
description: >-
  Tend (Tend Dental) is a consumer dental-care company offering modern,
  judgment-free dentistry through a network of design-forward "studios" across
  New York City, Boston, Atlanta, Washington DC, Nashville and Connecticut. The
  brand pairs a soothing in-person studio experience and top-rated dentists with
  a fully online booking and patient-intake flow at hellotend.com. Services span
  preventive hygiene, family dental care, cosmetic dentistry, veneers, Invisalign
  and clear aligners, orthodontics, dental implants, endodontics, sedation and
  emergency care. Backed by GV and Redpoint Ventures. This is a consumer web/
  booking business with no public developer API surface; the profile is enriched
  with identity, security-posture and discovery-probe artifacts only.
